<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Carrinho - A Casa do Baralho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- CABEÇALHO -->
    <header>
        <div class="logo">
            <h1>A casa do <br> <span>Baralho</span></h1>
        </div>
    </header>


    <!-- CONTAINER DO CARRINHO -->
    <main class="carrinho-container">
        <a href="index.html#cardapio" class="voltar-btn">← Voltar para o Cardápio</a>
       
        <h2>Itens Selecionados</h2>
       
        <div class="lista-itens">
            <div class="item-carrinho">
                <div class="item-detalhes">
                    <h4>Cerveja Pilsen 600ml</h4>
                    <span class="qtd-texto">Quantidade: 1</span>
                </div>
                <div class="item-preco">R$ 12,00</div>
            </div>
           
            <div class="item-carrinho">
                <div class="item-detalhes">
                    <h4>Porção de Batata Frita</h4>
                    <span class="qtd-texto">Quantidade: 1</span>
                </div>
                <div class="item-preco">R$ 35,00</div>
            </div>
        </div>


        <div class="resumo-total">
            Total Comercial: R$ 47,00
        </div>


        <form action="index.html">
            <button type="submit" class="finalizar-pedido">Chamar Garçom / Fechar Pedido</button>
        </form>
    </main>


    <!-- RODAPÉ -->
    <footer>
        <h4>A Casa do Baralho</h4>
        <p>© 2025 A Casa do Baralho. Todos os direitos reservados.</p>
    </footer>


</body>
</html>
